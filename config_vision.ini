; ЕДИНЫЙ МИНИМАЛЬНЫЙ КОНФИГ для vision_main.py
; Переключение между провайдерами - смена ОДНОЙ строки active.
; Формат секций 1:1 с config_v2*.ini из learn-in-play1 (тот же LLMClient).

[api]
active = local
; local    -> секция [api_local]   (например Ollama, офлайн)
; remote   -> секция [api_remote]  (любой OpenAI-совместимый: OpenAI,
;             OpenRouter, Mistral, Groq, HuggingFace router и т.д.)
verify_ssl = true

; debug = true -> подробный лог КАЖДОГО HTTP-запроса к этому провайдеру
; в стиле оригинального hallucination_test.py: таймстампы отправки и
; получения ответа, и ПОЛНОЕ сырое тело ответа сервера (весь JSON с
; отступами). Полезно для диагностики "что конкретно вернул провайдер",
; но очень многословно - для обычной работы держи false. Можно включить
; отдельно для [api] и [text_api] независимо.
debug = false

; silent = true -> main.py не печатает НИЧЕГО в консоль, кроме
; финального JSON-результата в конце, и не сохраняет result.json на
; диск (только печатает JSON). Удобно, когда main.py вызывается как
; подпроцесс из другой программы, которая сама парсит JSON из stdout.
; silent = false (по умолчанию) -> обычный подробный лог, как сейчас,
; ПЛЮС дополнительно сохраняется result.json на диск в конце.
silent = false

; Таймаут ОДНОГО HTTP-запроса к модели, в секундах. НИЧЕГО в коде
; не зашито - меняешь эти два числа тут, код трогать не нужно.
; timeout_seconds       - для обычных текстовых запросов (chat)
; timeout_seconds_vision - для запросов с картинкой (chat_vision),
;                          обычно требуют заметно больше времени,
;                          особенно на CPU без GPU-ускорения.
timeout_seconds = 180
timeout_seconds_vision = 1200

retries = 1
error_retries = 2
error_retry_wait_sec = 30
max_retry_after_sec = 120

; ---------------------------------------------------------------
; ОФЛАЙН: Ollama на своей машине, модель с поддержкой vision
; (например qwen2.5vl, llava, gemma3, moondream)
; ---------------------------------------------------------------
[api_local]
base_url = http://localhost:11434
api_key = ollama
model = gemma4:26b-a4b-it-q4_K_M
api_format = ollama
num_ctx = 8192
think = false

; ---------------------------------------------------------------
; ОНЛАЙН: любой OpenAI-совместимый провайдер.
; Просто меняешь base_url / api_key / model под нужного провайдера,
; код (vision_main.py) трогать не нужно.
;
; OpenAI:
;   base_url = https://api.openai.com/v1
;   model = gpt-4o-mini
;
; OpenRouter (агрегатор десятков моделей и провайдеров):
;   base_url = https://openrouter.ai/api/v1
;   model = qwen/qwen2.5-vl-7b-instruct
;
; Mistral (La Plateforme, есть vision-модели pixtral):
;   base_url = https://api.mistral.ai/v1
;   model = pixtral-12b-2409
;
; Groq:
;   base_url = https://api.groq.com/openai/v1
;   model = llama-3.2-11b-vision-preview
;
; HuggingFace router:
;   base_url = https://router.huggingface.co/v1
;   model = Qwen/Qwen2.5-VL-7B-Instruct
; ---------------------------------------------------------------
[api_remote]
base_url = https://openrouter.ai/api/v1
api_key = your_api_key_here
model = qwen/qwen2.5-vl-7b-instruct
api_format = openai

; =================================================================
; ОПЦИОНАЛЬНО: отдельный, полностью независимый профиль для ТЕКСТОВЫХ
; запросов (поисковый запрос, классификация ссылок, анализ HTML,
; финальная валидация) - отдельно от vision (chat_vision).
;
; Если секция [text_api] отсутствует - используется тот же провайдер,
; что и для vision (секция [api] выше), как было раньше. Ничего
; переносить не нужно для существующих конфигов.
;
; Пример ниже: vision работает ЛОКАЛЬНО через Ollama (дёшево и быстро
; для картинок), а текстовый анализ/валидация уходят В ОБЛАКО через
; OpenRouter - можно взять более сильную или более дешёвую текстовую
; модель, не связанную с тем, что установлено локально.
; =================================================================
[text_api]
active = remote
verify_ssl = true
timeout_seconds = 180
retries = 1
error_retries = 2
error_retry_wait_sec = 30
debug = false

[text_api_local]
base_url = http://localhost:11434
api_key = ollama
model = qwen3:8b
api_format = ollama
num_ctx = 8192
think = false

[text_api_remote]
base_url = https://openrouter.ai/api/v1
api_key = your-token-here
model = nvidia/nemotron-3-ultra-550b-a55b:free
#poolside/laguna-s-2.1:free
#openai/gpt-oss-20b:free
api_format = openai
num_ctx = 32767

; Явный бюджет контекстного окна модели в токенах - у remote-провайдеров
; (в отличие от Ollama) нет параметра num_ctx, так что клиент не знает
; реальный лимит модели без этой настройки. Используется, чтобы решить,
; нужно ли резать длинный текст страницы на несколько частей и делать
; НЕСКОЛЬКО последовательных заходов в LLM вместо одного обрезанного
; запроса (см. try_full_page_text в main.py). Если не указано - берётся
; консервативный дефолт 8000 токенов.
context_budget_tokens = 100000

; =================================================================
; ОПЦИОНАЛЬНО: SOCKS5-прокси для Chrome И для удалённых API-запросов
; (например если ChatGPT/OpenRouter/HuggingFace недоступны прямым
; соединением и нужен обход через ProxyChains/SOCKS5-туннель).
;
; enabled = false (по умолчанию) -> прокси не используется вообще,
; всё работает как раньше.
;
; enabled = true -> Chrome запускается с socks5://host:port, И
; ЛЮБОЙ удалённый (не-localhost) HTTP-запрос к API тоже идёт через
; этот прокси. Локальный Ollama (localhost/127.0.0.1) ВСЕГДА идёт
; напрямую, прокси на него не распространяется - ни для браузера,
; ни для API-клиента.
;
; Требует установленный PySocks для API-части:
;   pip install pysocks --break-system-packages
; Для Chrome PySocks не нужен - Playwright поддерживает SOCKS5 сам.
; =================================================================
; =================================================================
; SOCKS5-прокси - ВСТРОЕННЫЙ способ (не через системный proxychains-ng).
;
; ВАЖНО: proxychains-ng часто НЕ работает с Chrome - браузер запускает
; изолированные (sandboxed) renderer-процессы, чьи сетевые вызовы
; proxychains-ng (работающий через LD_PRELOAD-перехват на уровне
; процесса) не всегда может перехватить из-за этой изоляции. Именно
; поэтому здесь используется НЕ proxychains, а СВОЙ механизм:
;
;   - Для Chrome: Playwright настраивает прокси НАПРЯМУЮ через
;     встроенную в сам браузер поддержку прокси (chrome://net-internals
;     уровень), см. параметр proxy при launch_persistent_context в
;     main.py - работает независимо от LD_PRELOAD/proxychains.
;   - Для API-запросов (LLMClient в llm_api.py): requests + PySocks со
;     схемой "socks5h" (DNS резолвится через сам прокси, без утечек).
;
; enabled = true ниже включает ОБА механизма одновременно - Chrome и
; API-запросы пойдут через один и тот же SOCKS5-сервер host:port.
; НЕ запускай при этом main.py дополнительно через "proxychains4
; python3 main.py" - получится конфликт/двойное проксирование.
;
; Локальный Ollama (localhost/127.0.0.1) ВСЕГДА идёт напрямую, минуя
; прокси - ни для API-клиента (см. NO_PROXY_HOSTS в llm_api.py), ни
; для Chrome (см. "bypass" в main.py).
; =================================================================
[proxy]
; enabled - общий флаг "по умолчанию", используется, только если
; browser_enabled/api_enabled НЕ заданы явно ниже (обратная
; совместимость со старыми конфигами без раздельных настроек).
enabled = true

; Раздельное управление - можно включить прокси для одного и
; выключить для другого:
;   browser_enabled - только для Chrome (Playwright proxy)
;   api_enabled     - только для API-запросов (LLMClient/requests)
; Например: Chrome без прокси (напрямую в интернет), а текстовые
; запросы к OpenRouter - через прокси:
;   browser_enabled = false
;   api_enabled = true
browser_enabled = true
api_enabled = true

host = 127.0.0.1
port = 1080

; =================================================================
; Таймауты для самого Chrome (не для LLM-запросов - те в [api]/[text_api]).
; launch_timeout_ms - сколько ждать запуска браузера, прежде чем
;                     считать это зависанием (в мс). БЕЗ этой настройки
;                     запуск мог висеть БЕСКОНЕЧНО (например при
;                     конфликте с внешним proxychains-ng), единственный
;                     выход был Ctrl+C.
; navigation_timeout_ms - таймаут по умолчанию для навигации/ожидания
;                         элементов там, где явный timeout не указан
;                         в конкретном вызове кода.
; =================================================================
[browser]
launch_timeout_ms = 30000
navigation_timeout_ms = 20000

; Общий лимит времени на весь прогон (в секундах). Если после текущего
; проверенного сайта уже потрачено больше этого времени - следующий
; сайт из выдачи Google уже не пробуем, работаем с тем, что нашли.
; Реальный случай: прогон проверил 3 сайта, каждый через долгий
; vision-fallback, суммарно занял больше часа (3768 сек) - лимит ниже
; не даст повториться такому марафону.
max_total_runtime_sec = 1800

; Защита от бесконечного скролла - страницы с infinite scroll/ленивой
; подгрузкой (соцсети, каталоги товаров и т.п.) могут генерировать
; новый контент при скролле практически бесконечно. Это ограничивает,
; сколько скриншотов максимум делается за один fallback-проход
; (каждый скриншот = один шаг скролла на высоту viewport'а). Пример:
; со значением 7 скролл остановится, даже не дойдя до конца страницы,
; если та слишком длинная/бесконечная.
max_scroll_screenshots = 7

[google]
; Перед тем как переходить по ссылкам из выдачи, сначала смотрим саму
; страницу результатов Google - СНАЧАЛА текст из DOM (дёшево и быстро),
; и только если там ничего конкретного нет - скриншот + vision. Если
; ответ уже есть в featured snippet или AI Overview, сайты вообще не
; открываем.
; Реальный случай: ответ ("Nordwind, с 5 по 11 августа 2026") был виден
; прямо на скриншоте выдачи, а пайплайн вместо этого пошёл на первый
; сайт (капча) и второй (модель выдумала детали).
check_snippet_before_opening_links = true

; Если ответ не виден сразу, потому что AI Overview свёрнут за
; "Показать ещё"/"Show more" - пробуем раскрыть его перед повторной
; проверкой (тем же способом, что и обычный vision-fallback на сайтах).
expand_ai_overview = true
